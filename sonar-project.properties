# SonarQube Configuration for Corporate Banking Project

# Project Information
sonar.projectKey=corporate-banking
sonar.projectName=Corporate Banking System
sonar.projectVersion=1.0

# Source Code Paths
sonar.sources=corpbank-ui/src,corporate-banking-backend/src
sonar.tests=corpbank-ui/src/test,corporate-banking-backend/src/test
sonar.inclusions=**/*.ts,**/*.tsx,**/*.java,**/*.js,**/*.jsx
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**

# Language Properties
sonar.typescript.lcov.reportPaths=corpbank-ui/coverage/lcov.info
sonar.java.binaries=corporate-banking-backend/target/classes
sonar.java.test.binaries=corporate-banking-backend/target/test-classes

# Coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.java,**/*Test.java

# Quality Gates
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8
