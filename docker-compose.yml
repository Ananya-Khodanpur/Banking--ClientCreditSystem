services:
  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend (Spring Boot API)
  backend:
    build:
      context: ./corporate-banking-backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongo:27017/corpbank?authSource=admin
      JWT_SECRET: corpbank-secret-key-for-jwt-authentication-256-bit-minimum-length
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  # Frontend (React App)
  frontend:
    build:
      context: ./corpbank-ui
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # SonarQube (Code Quality Analysis)
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  mongo-data:
  sonarqube_data:
  sonarqube_logs:
