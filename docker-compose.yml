version: "3.9"

services:
  # MongoDB
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_DB: corpbank
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend (Spring Boot)
  backend:
    build:
      context: ./corporate-banking-backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: mongodb://mongo:27017/corpbank
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      JWT_SECRET: corpbank-secret-key-for-jwt-authentication-256-bit-minimum-length
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      - mongo
    ports:
      - "8080:8080"   # Expose backend to host machine

  # Frontend (React/Vite + Nginx)
  frontend:
    build:
      context: ./corpbank-ui
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"  # Expose Vite dev server port (if using npm run dev)
      - "80:80"      # Expose Nginx if serving production build

volumes:
  mongo-data:
